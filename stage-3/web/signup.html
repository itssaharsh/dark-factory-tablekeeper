<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tablekeeper — sign up</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body data-page="signup">
  <header class="topband">
    <div class="topband-row">
      <a href="/" class="wordmark">Tablekeeper</a>
      <nav class="topband-nav" aria-label="Account">
        <span data-testid="current-user" class="current-user" hidden></span>
        <button type="button" data-testid="logout-button" class="btn btn-ghost" hidden>Log out</button>
        <a href="/login" class="nav-link" data-auth-nav="1">Log in</a>
        <a href="/signup" class="nav-link" data-auth-nav="1">Sign up</a>
        <a href="/lookup" class="nav-link">Find a booking</a>
      </nav>
    </div>
  </header>
  <main class="page page-narrow">
    <div class="card">
      <h1>Create your account</h1>
      <form id="signup-form" class="auth-form" novalidate>
        <p data-testid="auth-error" class="auth-error" hidden></p>
        <div class="field">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" data-testid="signup-email" class="control" required autocomplete="email">
        </div>
        <div class="field">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" data-testid="signup-password" class="control" required
                 minlength="8" autocomplete="new-password">
        </div>
        <div class="field">
          <label for="signup-display-name">Display name</label>
          <input type="text" id="signup-display-name" data-testid="signup-display-name" class="control" required>
        </div>
        <button type="submit" data-testid="signup-submit" class="btn btn-fill">Sign up</button>
      </form>
    </div>
  </main>
  <script src="/static/js/app.js"></script>
</body>
</html>
